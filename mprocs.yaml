# Agent Backend Development
#
# Processes:
#   agentbe-local   - Daemon on host via tsx --watch (no Docker)
#   agentbe-daemon  - Daemon in Docker container via tsx --watch (simulates remote)
#   nextjs          - NextJS example app
#   pybasic         - PyBasic CLI example app
#
# Usage:
#   make dev                 - Docker daemon (default)
#   make dev-local           - Local daemon (no Docker)
#   make nextjs              - Docker daemon + NextJS
#   make k8s-forward         - port-forwards to the k8s rooms
#
# Or directly:
#   mprocs                           - agentbe-daemon (Docker)
#   LOCAL=1 mprocs                   - agentbe-local (no Docker)
#   NEXTJS=1 mprocs                  - agentbe-daemon + NextJS
#   PYBASIC=1 mprocs                 - agentbe-daemon + PyBasic
#   LOCAL=1 NEXTJS=1 mprocs          - agentbe-local + NextJS
#   K8S=1 mprocs                     - port-forwards to the k8s rooms (make k8s-forward)
#
# TUI shortcuts:
#   Tab/Shift+Tab - cycle processes
#   Space - start/stop process
#   r - restart
#   f - focus (full screen)
#   q - quit

procs:
  # Port-forwards to the k8s document rooms (see room/examples/k8s/).
  # Enable with K8S=1, or `make k8s-forward`.
  #
  # These are supervised rather than backgrounded because a port-forward dies
  # whenever its room pod restarts — silently, which makes a redeploy look like
  # a room failure. Here the process shows as stopped and `r` restarts it.
  room-acme-forward:
    shell: |
      [ -z "$K8S" ] && echo "Skipped (set K8S=1 to enable)" && exit 0
      exec kubectl --context kind-agentbe -n agentbe port-forward svc/room-acme 18861:8080
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"

  room-globex-forward:
    shell: |
      [ -z "$K8S" ] && echo "Skipped (set K8S=1 to enable)" && exit 0
      exec kubectl --context kind-agentbe -n agentbe port-forward svc/room-globex 18862:8080
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"

  # Local daemon — runs directly on host, no Docker
  # Enable with LOCAL=1
  agentbe-local:
    shell: |
      [ -n "$K8S" ] && echo "Skipped (K8S=1 session)" && exit 0
      [ -z "$LOCAL" ] && echo "Skipped (set LOCAL=1 to enable)" && exit 0
      echo "Starting agentbe-daemon locally (tsx --watch)..."
      cd packages/agent-backend/typescript
      exec npx tsx --watch src/cli.ts daemon \
        --rootDir /tmp/agent-backend-workspace \
        --local-only
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"

  # Docker daemon — simulates remote deployment
  # Runs by default; skip with LOCAL=1
  # Uses the same launcher as users (agent-backend start-docker) in --dev mode:
  # builds the image if missing, mounts TypeScript source, tsx --watch hot-reloads
  agentbe-daemon:
    shell: |
      [ -n "$K8S" ] && echo "Skipped (K8S=1 session)" && exit 0
      [ "$LOCAL" = "1" ] && echo "Skipped (LOCAL=1, using agentbe-local)" && exit 0
      ENV_FILE="$(pwd)/.env.example"
      [ -f ".env" ] && ENV_FILE="$(pwd)/.env"
      cd packages/agent-backend/typescript
      exec npx tsx src/cli.ts start-docker --dev --foreground --env-file "$ENV_FILE"
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"

  # NextJS example app
  # Skipped by default; enable with NEXTJS=1
  nextjs:
    shell: |
      [ -z "$NEXTJS" ] && echo "Skipped (set NEXTJS=1 to enable)" && exit 0
      exec pnpm run dev
    cwd: "examples/NextJS"
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"

  # PyBasic CLI example app
  # Skipped by default; enable with PYBASIC=1
  pybasic:
    shell: |
      [ -z "$PYBASIC" ] && echo "Skipped (set PYBASIC=1 to enable)" && exit 0
      cd examples/PyBasic
      exec uv run python main.py
    stop: "SIGTERM"
    env:
      FORCE_COLOR: "1"
